<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - Enseignant</title>
    <link rel="stylesheet" href="{% static 'css/dash_eng.css' %}">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="profile-img">
                <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <h3 id="userName"></h3>
            <p id="userSubtitle"></p>
        </div>

        <ul class="nav-menu">
            <li>
                <a href="{% url 'dashboard_enseignant' %}" class="nav-link active">
                    <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Tableau de Bord
                </a>
            </li>
            <li>
                <a href="{% url 'mes_groupes' %}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    Mes Groupes
                </a>
            </li>
            <li>
                <a href="{% url 'notes' %}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    Gestion des Notes
                </a>
            </li>
            <li>
                <a href="{% url 'absences' %}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Absences
                </a>
            </li>
            <li>
                <a href="{% url 'ressources' %}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    Ressources
                </a>
            </li>
            <li>
                <a href="{% url 'messagerie_enseignant' %}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7
                                 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8
                                 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                        </path>
                    </svg>
                    Messagerie
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main -->
    <main class="main-content">
        <div class="header">
            <h1>Tableau de Bord</h1>

            <div class="header-actions">

                <!-- Bell = Notifications -->
                <button class="notification-btn" id="notifBtn" title="Notifications">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="badge" id="notifBadge" style="display:none;">0</span>
                </button>

                <!-- Envelope = Messages -->
                <button class="notification-btn" id="msgBtn" title="Messages"
                        onclick="window.location.href='{% url 'messagerie_enseignant' %}'">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <span class="badge" id="msgBadge" style="display:none;">0</span>
                </button>

                <!-- Logout -->
                <button id="logoutBtn" title="Déconnexion">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>

            </div>
        </div>

        <!-- KPI Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statEtudiants">—</div>
                <div class="stat-label">Étudiants</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statGroupes">—</div>
                <div class="stat-label">Groupes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statHeures">—</div>
                <div class="stat-label">Heures ce mois</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statMoyenne">—</div>
                <div class="stat-label">Moyenne générale</div>
            </div>
        </div>

    </main>

    <script src="{% static 'js/notifications.js' %}"></script>
    <script src="{% static 'js/dash_ens.js' %}"></script>
</body>
</html>
